name: Update weather snapshot
run-name: Update weather snapshot (${{ inputs.source || github.event_name }})

on:
  schedule:
    - cron: "28,58 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Scheduler or operator starting this update
        required: false
        default: manual

permissions:
  contents: write

concurrency:
  group: update-weather-snapshot
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore previous snapshot
        run: |
          git fetch origin weather-data:refs/remotes/origin/weather-data || true
          if git show origin/weather-data:data/weather.json > /tmp/previous-weather.json 2>/dev/null; then
            cp /tmp/previous-weather.json data/weather.json
          fi
      - name: Download METAR and TAF reports
        run: node scripts/update-weather.mjs
      - name: Publish snapshot to weather-data branch
        run: |
          cp data/weather.json /tmp/weather.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan weather-data-publish
          git reset --hard
          git rm -rf . 2>/dev/null || true
          mkdir -p data
          cp /tmp/weather.json data/weather.json
          git add data/weather.json
          git commit -m "Update weather snapshot"
          git push --force origin HEAD:weather-data
